; Los mismos límites que tenía el Procfile (fotos de guías y del catálogo).
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 512M
max_execution_time = 120
max_file_uploads = 40

; El código compilado queda en memoria: es lo que más acelera.
; validate_timestamps = 0: los archivos no cambian hasta el próximo despliegue.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

expose_php = Off
